##############################################################################
# BeautyVault - Nginx Reverse Proxy Configuration
# Local Development - HTTP only
# Handles: API (Laravel PHP-FPM), SPA (Vue 3), WebSockets (Reverb)
##############################################################################

upstream php_fpm {
    server backend:9000;
}

upstream reverb_ws {
    server reverb:8080;
}

upstream frontend_spa {
    server frontend:80;
}

# Local HTTP server
server {
    listen 80;
    server_name _;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Max body size for image/file uploads
    client_max_body_size 20M;

    root /var/www/html/public;
    index index.php;

    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Laravel API & static assets ──────────────────────────────────────────
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Laravel PHP-FPM ──────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Timeouts for long-running requests
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 60;
    }

    # ── Laravel Reverb WebSockets ─────────────────────────────────────────────
    location /app {
        proxy_pass http://reverb_ws;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Static Backend Assets ─────────────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        try_files $uri @frontend;
    }

    # ── Vue 3 SPA ─────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://frontend_spa;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Frontend fallback ─────────────────────────────────────────────────────
    location @frontend {
        proxy_pass http://frontend_spa;
    }

    # ── Deny access to hidden files ────────────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }
}