version: '3.9'

services:
  # ─────────────────────────────────────
  # Nginx Reverse Proxy
  # ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: beautyvault_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - beautyvault_net
    restart: unless-stopped

  # ─────────────────────────────────────
  # Laravel Backend (PHP-FPM)
  # ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: beautyvault_backend
    environment:
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-beautyvault}
      - DB_USERNAME=${DB_USERNAME:-beautyvault}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=${REVERB_APP_ID}
      - REVERB_APP_KEY=${REVERB_APP_KEY}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET}
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=${MEILISEARCH_KEY:-masterKey}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_BUCKET=${AWS_BUCKET}
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - beautyvault_net
    restart: unless-stopped

  # ─────────────────────────────────────
  # Vue 3 Frontend (Nginx static)
  # ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      args:
        VITE_API_URL: ${APP_URL:-http://localhost}/api/v1
    container_name: beautyvault_frontend
    networks:
      - beautyvault_net
    restart: unless-stopped

  # ─────────────────────────────────────
  # MySQL 8.0
  # ─────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: beautyvault_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-beautyvault}
      MYSQL_USER: ${DB_USERNAME:-beautyvault}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beautyvault_net
    restart: unless-stopped

  # ─────────────────────────────────────
  # Redis 7.0
  # ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: beautyvault_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redissecret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redissecret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beautyvault_net
    restart: unless-stopped

  # ─────────────────────────────────────
  # Laravel Queue Worker
  # ─────────────────────────────────────
  queue_worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: beautyvault_queue
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE:-beautyvault}
      - DB_USERNAME=${DB_USERNAME:-beautyvault}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
    depends_on:
      - backend
      - redis
    networks:
      - beautyvault_net
    restart: unless-stopped

  # ─────────────────────────────────────
  # Laravel Reverb WebSocket Server
  # ─────────────────────────────────────
  reverb:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: beautyvault_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE:-beautyvault}
      - DB_USERNAME=${DB_USERNAME:-beautyvault}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REVERB_APP_ID=${REVERB_APP_ID}
      - REVERB_APP_KEY=${REVERB_APP_KEY}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET}
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - backend
      - redis
    networks:
      - beautyvault_net
    restart: unless-stopped

  # ─────────────────────────────────────
  # Laravel Scheduler (Cron)
  # ─────────────────────────────────────
  scheduler:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: beautyvault_scheduler
    command: sh -c "while true; do php artisan schedule:run --no-interaction && sleep 60; done"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE:-beautyvault}
      - DB_USERNAME=${DB_USERNAME:-beautyvault}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
    depends_on:
      - backend
    networks:
      - beautyvault_net
    restart: unless-stopped

  # ─────────────────────────────────────
  # Meilisearch (Full-Text Search Engine)
  # ─────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: beautyvault_meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKey}
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "7700:7700"
    networks:
      - beautyvault_net
    restart: unless-stopped

  # ─────────────────────────────────────
  # phpMyAdmin (Dev Only -- enable with: --profile dev)
  # ─────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: beautyvault_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USERNAME:-beautyvault}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - beautyvault_net
    profiles:
      - dev

networks:
  beautyvault_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  meilisearch_data:
  backend_storage:
